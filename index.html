<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Graphica | Online Graphing Calculator</title>
    <meta
      name="description"
      content="Plot linear, quadratic, cubic, quartic, exponential, logarithmic and custom functions. Pan, zoom, trace points, find roots and extrema, view value tables and share your graph."
    />
    <meta name="theme-color" content="#070b14" />
    <meta property="og:title" content="Graphica | Online Graphing Calculator" />
    <meta property="og:description" content="Plot any function, find roots and extrema, and share your graph with a link." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      // apply the saved theme before first paint
      try {
        var t = localStorage.getItem('graphica-theme')
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Graphica home">
        <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#22d3ee" />
              <stop offset="1" stop-color="#8b5cf6" />
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="11" fill="url(#lg)" />
          <path d="M6 22c4 0 5-10 9-10s5 16 10 16 5-10 9-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
        </svg>
        <span class="brand-text"><strong>Graphica</strong><small>Graphing calculator</small></span>
      </a>
      <div class="actions">
        <button class="btn" id="btn-share" type="button" title="Copy a link to this graph">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1" /></svg>
          <span>Share</span>
        </button>
        <button class="btn" id="btn-png" type="button" title="Download the graph as an image">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" /></svg>
          <span>PNG</span>
        </button>
        <button class="btn icon-only" id="btn-theme" type="button" aria-label="Switch theme" title="Switch theme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" /></svg>
        </button>
      </div>
    </header>

    <main class="layout">
      <section class="stage" aria-label="Graph">
        <canvas id="plot" tabindex="0" aria-label="Interactive graph. Drag to pan, scroll or pinch to zoom. Arrow keys pan, plus and minus zoom, zero fits the view."></canvas>
        <div class="toolbar" role="toolbar" aria-label="Graph controls">
          <button class="tool" id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <button class="tool" id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
          </button>
          <button class="tool" id="fit" type="button" aria-label="Fit graph to view" title="Fit to curves">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
          </button>
          <button class="tool" id="reset" type="button" aria-label="Reset view" title="Reset view">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 1 3 6.2M4 19v-5h5" /></svg>
          </button>
        </div>
        <div class="readout" id="readout" aria-live="off"></div>
        <p class="hint">Drag to pan · scroll to zoom · hover to trace</p>
        <div class="empty" id="empty" hidden>
          <strong>No functions yet</strong>
          <span>Add one from the panel to start plotting.</span>
        </div>
      </section>

      <aside class="panel" aria-label="Functions and data">
        <div class="tabs" role="tablist" aria-label="Panel sections">
          <button class="tab" role="tab" id="tab-btn-curves" aria-selected="true" aria-controls="tab-curves" type="button">Functions</button>
          <button class="tab" role="tab" id="tab-btn-table" aria-selected="false" aria-controls="tab-table" type="button">Table</button>
        </div>

        <div class="tabpanel" id="tab-curves" role="tabpanel" aria-labelledby="tab-btn-curves">
          <div id="curve-list" class="curve-list"></div>

          <div class="add">
            <p class="label">Add a function</p>
            <div class="chips" id="add-chips"></div>
          </div>

          <div class="add">
            <p class="label">Examples</p>
            <div class="chips" id="example-chips"></div>
          </div>
        </div>

        <div class="tabpanel" id="tab-table" role="tabpanel" aria-labelledby="tab-btn-table" hidden>
          <div class="table-controls">
            <label class="field">
              <span>Function</span>
              <select id="table-curve"></select>
            </label>
            <label class="field narrow">
              <span>Step</span>
              <input id="table-step" type="number" step="any" min="0" value="1" inputmode="decimal" />
            </label>
            <button class="btn" id="table-csv" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" /></svg>
              <span>CSV</span>
            </button>
          </div>
          <p class="muted small" id="table-note"></p>
          <div class="table-wrap">
            <table id="table">
              <thead>
                <tr><th scope="col">x</th><th scope="col">y</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </aside>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
